<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield/Square -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  <!-- AI Radar Pulse Ring -->
  <circle cx="56" cy="54" r="38" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <!-- Magnifying Glass Lens -->
  <circle cx="56" cy="54" r="26" fill="none" stroke="url(#orangeGrad)" stroke-width="8" filter="url(#glow)"/>
  <!-- Interior AI Spark / Target Center -->
  <circle cx="56" cy="54" r="8" fill="#f59e0b"/>
  <!-- Magnifying Handle -->
  <line x1="76" y1="74" x2="100" y2="98" stroke="url(#orangeGrad)" stroke-width="9" stroke-linecap="round"/>
</svg>